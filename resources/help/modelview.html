   <center> <h1> 模型视图 <br> </h1> </center><p></p>


   <p><center><img src="images/MainWindow.png" /></center></p>

   <p> 模型视图窗口以层次结构展示查看器窗口中出现的数据结构。每个分子在模型视图中表示为一个
   节点（图层），每个图层还可以有子图层，用来表示原子、键以及其他相关数据。

   <p> 图层的可见性由旁边的复选框控制。取消勾选后，该条目及其所有子项都会被隐藏。
   如果某个条目没有复选框（例如键），则其可见性只能由层级结构中更高的图层控制。

   <p> 许多图层带有配置选项，在模型视图中双击该图层即可访问。例如，双击分子图层会弹出
   下图所示的配置对话框：

   <p><center><img src="images/MoleculeConfigurator.png" /></center></p>

   <p> 每个图层都可以独立配置。有关 IQmol 中各类图层的更多信息，请参阅
   <a href="layers.html">图层</a>页面。
