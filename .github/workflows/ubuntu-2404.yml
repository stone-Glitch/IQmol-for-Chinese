name: Build on Ubuntu 24.04
on: [ push, pull_request ]
jobs:
  build-project:
    name: Build Project
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:

      - name: Checkout Project
        uses: actions/checkout@v4.2.2

      - name: Setup Fortran
        # fortran-lang/setup-fortran 只发布 x86_64 二进制，在 ubuntu-24.04-arm
        # 上会直接失败；ARM runner 镜像已自带 gfortran，无需该 action。
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        uses: fortran-lang/setup-fortran@v1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # ARM runner 跳过 setup-fortran，这里显式补 gfortran 保底
          sudo apt-get install gfortran -y
          sudo apt-get install libarchive-dev -y
          sudo apt-get install librust-bzip2-dev -y
          sudo apt-get install liblzma-dev -y
          sudo apt-get install libb2-dev -y
          sudo apt-get install libssh2-1-dev -y
          sudo apt-get install libqglviewer-dev-qt5 -y
          sudo apt-get install libopenmesh-dev -y
          sudo apt-get install libyaml-cpp-dev -y
          sudo apt-get install libopenbabel-dev -y
          sudo apt-get install libboost-iostreams-dev libboost-serialization-dev -y
          sudo apt-get install qtbase5-dev -y
          # 汉化 CI 依赖: Qt5LinguistTools 的 CMake config 由 qttools5-dev 提供, 不在 qtbase5-dev 内
          sudo apt-get install qttools5-dev qttools5-dev-tools -y
          # 本地成功环境也包含以下两项, 一并补齐避免后续缺失
          sudo apt-get install libqt5opengl5-dev libqt5sql5-sqlite -y
          sudo ln -s /usr/include/openbabel3/openbabel /usr/include/

      - name: Link Dependencies on x86_64
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          sudo ln -s /usr/lib/x86_64-linux-gnu/libQGLViewer-qt5.so /usr/lib/x86_64-linux-gnu/libQGLViewer.so

      - name: Link Dependencies on aarch64
        if: ${{ matrix.os == 'ubuntu-24.04-arm' }}
        run: |
          sudo ln -s /usr/lib/aarch64-linux-gnu/libQGLViewer-qt5.so /usr/lib/aarch64-linux-gnu/libQGLViewer.so

      - name: Build Debug Project
        if: ${{ matrix.type == 'Debug' }}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j4

      - name: Build Release Project
        if: ${{ matrix.type == 'Release' }}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4

      - name: Test Project
        run: |
          cd build
          ctest

