name: Build on macOS

# 目的：补齐「三平台（Linux / Windows / macOS）」构建证据中缺失的 macOS 一环。
#       在 GitHub 原生 macOS runner 上用 Homebrew 依赖编译 IQmol 中文版，
#       产出可分发 DMG 前的 .app 包（签名/公证需 Apple 开发者证书，CI 不做）。
#
# ⚠️ 本文件仍属【草案】：编译/依赖链尚未在真实 macOS runner 上跑通。
#   2026-11-14 首次随 0b9eb9b 推送即被取消（2s、0 steps），Annotation 为
#   "The configuration 'macos-14-arm64-us-default' is not supported"。原因是 GitHub
#   已于 2026-11-02 退役 macOS 14 (Sonoma) 托管镜像，pinned 到 macos-14 的 job 在
#   调度阶段就被拒绝、根本拿不到 runner。故改用 macos-15（Apple Silicon 最近替代）。
#   后续仍需按 runner 实际报错微调依赖/路径，方可视为「三平台证据」正式成立。
#
# 关键坑（已据 configure 脚本与构建指南预判，供复核时对照）：
#   1) configure 在 Darwin 下【硬编码】QT=/opt/homebrew/Cellar/qt@5/5.15.13_1，
#      但 brew 安装的 qt@5 版本号会变，硬编码路径会失效。故本工作流强制
#      export CMAKE_PREFIX_PATH="$(brew --prefix qt@5)"，configure 检测到该变量后会
#      改用它（见 configure 第 77-81 行），从而版本无关。
#   2) qt@5 是 keg-only，不会自动进 PATH；需把其 bin 加入 PATH 以拿到 lrelease/macdeployqt。
#   3) mac_deploy.sh 内含 codesign + notarytool（需证书/密码），CI 无证书，故本工作流
#      只跑 macdeployqt 做框架捆绑 + zip，签名/dmg/公证留作发版手动步骤。
#   4)【已纠正】原注释称「macOS 用 Homebrew 系统级 OpenBabel、无需解包子模块」是错的。
#      CMakeLists.txt 第 132/141/150 行的 if (LINUX) / else() 中，APPLE 与 WIN32 同属
#      else() 分支，走 add_subdirectory(modules/...) 内嵌编译 QGLViewer / OpenBabel /
#      yaml-cpp / libarchive / libssh2 / libxml2 / hdf5（与 windows-mingw.yml 第 74-76
#      行结论一致）。而 actions/checkout 默认 submodules: false，故必须解包
#      submodules-package/IQmol-submodules.tar.gz，否则 configure 直接找不到源码。
#   5)【已纠正】原 brew 清单有 3 个 formula 在 Homebrew 中根本不存在（2026-11-14 逐一
#      核对 formulae.brew.sh API）：openbabel(404)、libqglviewer(404)、gfortran(404)。
#      OpenBabel/QGLViewer 由 4) 的内嵌源码提供；Fortran 编译器由 gcc formula 提供。
#      docs/构建与打包/构建与部署指南.md 第五节里同样的错误命令已同步修正。
#   6) 根 CMakeLists.txt 第 4 行 project(... LANGUAGES CXX C Fortran)，缺 Fortran
#      编译器会在 configure 阶段就失败，故下面显式探测 gfortran 并写入 FC。
#   7)【已纠正】CMake 4 与内嵌 OpenBabel 3.1.1 硬不兼容：
#      openbabel/CMakeLists.txt:14 写死 cmake_policy(SET CMP0042 OLD)（CMake 4 已移除
#      该 OLD 行为），:774 的 uninstall target 又与 yaml-cpp 撞名。
#      CMAKE_POLICY_VERSION_MINIMUM 只能越过 cmake_minimum_required，绕不过策略移除。
#      故固定 CMake 3.31.6（Windows CI 已验证同一套内嵌源码可跑通），并复用
#      scripts/openbabel_CMakeLists.txt 的 if(NOT TARGET uninstall) 补丁。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    # paths-ignore：纯文档改动（md / docs/）不影响 macOS 产物，跳过省 runner。
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

# 附加到 Release 需要写权限，否则该步 403（与 windows-mingw.yml 同源结论）。
permissions:
  contents: write

jobs:
  build-macos:
    name: 编译 + 打包 (macOS)
    # macos-14 已于 2026-11-02 退役，pinned 到它的 job 会在调度阶段被取消（见文件头注释）。
    # macos-15 = Apple Silicon (arm64) 托管镜像；确需 Intel x86_64 时请改用 macos-15-large，
    # 不要回退到 macos-13——该镜像同样已停止供应。
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4.2.2

      - name: 安装依赖（Homebrew）
        # 只装真正的系统级依赖。OpenBabel / QGLViewer / yaml-cpp / libarchive /
        # libssh2 / libxml2 / hdf5 由下一步解包的内嵌 modules/ 源码编译（见文件头坑 4）。
        #   qt@5   —— Qt5 框架 + lrelease/macdeployqt（keg-only）
        #   boost  —— IQmol 直接依赖
        #   libomp —— OpenMP（configure 探测 /opt/homebrew/opt/libomp）
        #   gcc    —— 提供 gfortran（根 CMakeLists 的 Fortran 语言，见文件头坑 6）
        run: |
          brew update || true
          brew install qt@5 boost libomp gcc

      - name: 安装 CMake 3.x（内嵌 OpenBabel 不兼容 CMake 4）
        # macOS-15 runner 预装 CMake 4.x，已移除 CMP0042 的 OLD 行为，而
        # modules/openbabel/CMakeLists.txt:14 硬写 cmake_policy(SET CMP0042 OLD)，
        # 用 CMAKE_POLICY_VERSION_MINIMUM 也绕不过（策略本身被移除）。Windows CI
        # 用 MSYS2 的 CMake 3.x 走同一套内嵌源码能成功，故此处固定 3.31.6。
        run: |
          set -e
          CMAKE_VER=3.31.6
          curl -fsSL -o /tmp/cmake3.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-macos-universal.tar.gz"
          mkdir -p /tmp/cmake3
          tar -xzf /tmp/cmake3.tar.gz -C /tmp/cmake3
          CMAKE_BIN="$(find /tmp/cmake3 -type f -name cmake -path '*/bin/*' | head -1)"
          test -n "$CMAKE_BIN" || { echo "::error::未找到 cmake 二进制"; exit 1; }
          echo "$(dirname "$CMAKE_BIN")" >> "$GITHUB_PATH"
          "$CMAKE_BIN" --version

      - name: 解包子模块源码
        # actions/checkout 默认 submodules: false，而非 Linux 分支必须内嵌 modules/ 源码。
        # BSD tar 支持 symlink，无需像 windows-mingw.yml 那样逐项排除；但仍校验关键文件。
        run: |
          set -e
          PKG=submodules-package/IQmol-submodules.tar.gz
          test -f "$PKG" || { echo "::error::缺少 $PKG"; exit 1; }
          tar -xzf "$PKG"
          for f in modules/libarchive/tar/test/CMakeLists.txt \
                   modules/libarchive/libarchive/test/CMakeLists.txt \
                   modules/libssh2/tests/CMakeLists.txt \
                   modules/yaml-cpp/test/CMakeLists.txt; do
            test -f "$f" || { echo "::error::缺失 $f"; exit 1; }
          done
          ls -d modules/*/ >/dev/null || { echo "::error::modules/ 为空"; exit 1; }
          echo "== 解包结果 =="
          for d in modules/*/; do
            printf "  %-28s %s\n" "$d" "$(find "$d" -type f 2>/dev/null | wc -l)"
          done

      - name: 应用 OpenBabel CMake 补丁（uninstall 目标冲突）
        # yaml-cpp 先定义 uninstall，OpenBabel 第 774 行再定义即撞车（CMP0002）。
        # 复用 scripts/build_windows.sh 2b 步的同一补丁；该文件与原版只差
        # if(NOT TARGET uninstall) 两行，不含任何 Windows 专属内容。
        run: |
          set -e
          OB=modules/openbabel/CMakeLists.txt
          if ! grep -q 'NOT TARGET uninstall' "$OB"; then
            cp scripts/openbabel_CMakeLists.txt "$OB"
            echo "已应用 uninstall 目标保护"
          else
            echo "补丁已存在，跳过"
          fi
          grep -n 'NOT TARGET uninstall' "$OB"

      - name: 子模块版本漂移校验
        run: scripts/check_submodules_drift.sh

      - name: 暴露 Qt5 工具链与 Fortran 编译器
        # 关键：覆盖 configure 的硬编码 Cellar 路径，使其版本无关；并把 lrelease/macdeployqt 加入 PATH。
        # 另需显式给出 FC：Homebrew gcc 的 gfortran 常带版本后缀（gfortran-14），
        # CMake 自动探测可能找不到，而 project(... LANGUAGES ... Fortran) 缺它即 configure 失败。
        run: |
          QT_PREFIX="$(brew --prefix qt@5)"
          echo "QT_PREFIX=$QT_PREFIX"
          echo "CMAKE_PREFIX_PATH=$QT_PREFIX" >> "$GITHUB_ENV"
          echo "PATH=$QT_PREFIX/bin:$PATH" >> "$GITHUB_ENV"
          "$QT_PREFIX/bin/qmake" --version || true
          command -v lrelease && command -v macdeployqt
          if command -v gfortran >/dev/null 2>&1; then
            echo "FC=$(command -v gfortran)" >> "$GITHUB_ENV"
          else
            GFORTRAN="$(ls "$(brew --prefix gcc)"/bin/gfortran-* 2>/dev/null | sort -V | tail -1)"
            test -n "$GFORTRAN" || { echo "::error::未找到 gfortran"; exit 1; }
            echo "FC=$GFORTRAN" >> "$GITHUB_ENV"
          fi

      - name: 配置（./configure --release，自动走 Darwin 分支）
        env:
          # 上一步已固定 CMake 3.31.6；此下限用于抑制子模块老式
          # cmake_minimum_required(3.1/3.4) 的弃用告警，并兼容万一回落到
          # runner 预装 CMake 4 时的最低版本检查。真正的 CMP0042 移除问题
          # 只能靠 CMake 3.x 解决（见文件头坑 7）。
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -x
          # 未登录 gh 时无法拉取匿名 run 日志，故失败时把 configure.log 的关键报错
          # 回写成一条 annotation，便于从 check-runs annotations 端点定位。
          # macOS 的 pthread 由 libSystem 提供，没有独立 libpthread.dylib；
          # modules/openbabel/tools/CMakeLists.txt:96 的 find_library(PTHREAD_LIBRARY
          # NAMES pthread) 会返回 NOTFOUND，被 append 进 obabel 链接列表后
          # CMake Generate 直接失败。预设为库名 pthread（生成 -lpthread，
          # clang 在 Darwin 上可解析）即可让 find_library 跳过搜索。
          if ! ./configure --release -DPTHREAD_LIBRARY=pthread; then
            echo "::group::configure.log 末尾 60 行"
            tail -n 60 configure.log
            echo "::endgroup::"
            # 只取首个 CMake Error 上下文与日志末尾，避免被大量非致命
            # "Could NOT find ..."（Doxygen/LIBB2 等 optional 依赖）淹没根因。
            FIRST_ERR="$(grep -A 6 -iE 'CMake Error|fatal error' configure.log | head -14 | tr '\n' ' ' | cut -c1-600)"
            TAIL="$(tail -n 24 configure.log | tr '\n' ' ' | cut -c1-900)"
            echo "::error::configure 失败｜首个错误：${FIRST_ERR:-（无 CMake Error 行）}｜末尾：${TAIL}"
            exit 1
          fi
          test -f build/CMakeCache.txt || { echo "::error::configure 未生成 CMakeCache.txt"; exit 1; }

      - name: 编译
        run: |
          cd build
          # macOS arm64 托管 runner 内存有限，内嵌 OpenBabel 全量并行易 OOM（make 退出 2），
          # 固定 -j3 更稳；失败时把 error 行回写成 annotation 便于无 token 排障。
          if make -j3 > ../build.log 2>&1; then
            tail -n 20 ../build.log
          else
            echo "::group::build.log 末尾 60 行"
            tail -n 60 ../build.log
            echo "::endgroup::"
            ERRS="$(grep -iE 'error:|fatal error|undefined symbols|ld: |killed|signal 9' ../build.log | head -14 | tr '\n' ' ' | cut -c1-1400)"
            echo "::error::编译失败：${ERRS:-（build.log 无匹配错误行，请查看 run 日志）}"
            exit 1
          fi

      - name: 捆绑 Qt 框架（macdeployqt，不做签名）
        run: |
          set -e
          APP=build/bin/IQmol.app
          test -d "$APP" || { echo "::error::未生成 $APP"; exit 1; }
          macdeployqt "$APP" -verbose=1
          # 汉化必备：确认 zh_CN.qm 已随 bundle 生成（lrelease 可用时由 CMake 产出）
          if [ -f "$APP/Contents/Resources/translations/zh_CN.qm" ] || [ -f "$APP/Contents/MacOS/translations/zh_CN.qm" ]; then
            echo "zh_CN.qm 已随 bundle 生成"
          else
            echo "::warning::bundle 内未发现 zh_CN.qm，界面将回退英文（需 lrelease 在 PATH 且可用）"
          fi

      - name: 打包为 zip 产物
        run: |
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent IQmol.app IQmol-macOS-zh_CN.zip
          ls -la IQmol-macOS-zh_CN.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: IQmol-macos-zh_CN
          path: build/bin/IQmol-macOS-zh_CN.zip
          if-no-files-found: error
          retention-days: 30

      - name: 附加到 Release（仅在推送 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/IQmol-macOS-zh_CN.zip
          fail_on_unmatched_files: false
          draft: false
        # 包已产出并上传 artifact，挂 Release 只是多一个下载入口；权限不足时不阻塞主流程。
        continue-on-error: true
