name: Build & Package Windows (MinGW-w64)

# 目的：在 GitHub 原生 Windows runner 上编译 IQmol 中文版，
#       并产出**可直接分发的 Windows 压缩包**（不是只验证能编译）。
#
# 流水线：
#   checkout -> MSYS2(MinGW64) -> 解包子模块 -> cmake/ninja 编译
#     -> scripts/package_windows.sh（含自包含性自检）
#     -> 上传 artifact（每次） / 发布 Release（打 tag 时）
#
# 为什么用 MSYS2 而非 Qt 官方 MinGW：
#   scripts/deploy_windows.sh 的 DLL 闭包扫描基于 MSYS2 的 /mingw64 布局，
#   Qt 官方包无 pacman 依赖树，windeployqt 之外的运行库需手工凑齐。
#   两者产物等价（都是 MinGW-w64 x86_64），MSYS2 更省心。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: win-pkg-${{ github.ref }}
  cancel-in-progress: true

# ⚠️ 必须显式声明 contents: write，否则最后一步挂 Release 会 403。
#   实测（v3.2.4-zh_CN，run37112524311）：前 11 步全绿、包已产出，
#   唯独 "附加到 Release" 报
#     403 Resource not accessible by integration
#   根因是本仓库未声明 permissions，本仓库的 GITHUB_TOKEN 默认只读。
#   触发方式是 workflow 自己的 GITHUB_TOKEN，与个人 PAT 无关，
#   所以换 PAT 也没用，只能在 workflow 里声明权限。
permissions:
  contents: write

jobs:
  build-windows:
    name: 编译 + 打包 (Windows x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4.2.2

      - name: 安装 MSYS2 / MinGW-w64 工具链与依赖
        # 注意：这里刻意不开 update: true。
        # msys2/setup-msys2 的 update 会执行 `pacman -Syuu`，而完整升级
        # 需要「升级 -> 重启 shell -> 再升级」两阶段，单跑一次在 CI 上
        # 几乎必然失败（本仓库旧版工作流正是卡在这一步）。
        # GitHub 的 windows-2022 镜像里 MSYS2 已是近期快照，无需全量更新。
        #
        # 包名坑（已按 packages.msys2.org 索引逐一核对）：
        #   ✗ mingw-w64-x86_64-toolchain  —— 无此包，用 mingw-w64-x86_64-gcc
        #   ✗ mingw-w64-x86_64-qt5        —— 无此包，用 qt5-base 及所需子模块
        #   ✗ mingw-w64-x86_64-openbabel  —— MSYS2 仓库中不存在
        #   ✗ mingw-w64-x86_64-openmesh   —— MSYS2 仓库中不存在
        #   ✗ p7zip / mingw-w64-x86_64-p7zip —— 无此包，用 mingw-w64-x86_64-7zip
        # 之所以不装 openbabel/openmesh 系统包也没关系：CMakeLists.txt 的
        # 非 LINUX 分支本就 add_subdirectory(modules/openbabel|openmesh)，
        # 从 submodules-package 解出的源码内嵌构建（见 CMakeLists 第 104、288 行）。
        #
        # qt5-translations 不可省：它提供 /mingw64/share/qt5/translations/qt_zh_CN.qm，
        # 即 Qt 自身的中文翻译（标准对话框的 Cancel/OK/Open/Save 等按钮文案）。
        # 缺它时 IQmol 自己的 zh_CN.qm 照常工作，但标准按钮仍是英文，
        # 且 package_windows.sh 的发布前自检会硬拦截：
        #   ERROR: 分发包缺少 Qt 标准翻译 (bin/translations/qt*_zh_CN.qm)
        # 注意它和 qt5-tools 是两个包：lrelease 归 qt5-tools，翻译资源归 qt5-translations。
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-translations
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-declarative
            mingw-w64-x86_64-yaml-cpp
            mingw-w64-x86_64-libssh2
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-7zip
            mingw-w64-x86_64-make
            git

      - name: 环境自检（便于失败时定位）
        run: |
          echo "== msystem =="; echo "$MSYSTEM"
          echo "== gcc =="; gcc --version | head -1
          echo "== cmake =="; cmake --version | head -1
          echo "== windeployqt =="; command -v windeployqt || echo "(未在 PATH)"
          echo "== 7z =="; 7z 2>/dev/null | head -2 || echo "(7z 未就绪)"
          echo "== 磁盘 =="; df -h . | tail -1

      - name: 解包子模块源码
        run: |
          set -x
          if [ ! -f submodules-package/IQmol-submodules.tar.gz ]; then
            echo "::error::缺少 submodules-package/IQmol-submodules.tar.gz"
            exit 1
          fi
          # 包内顶层即 modules/，直接解到仓库根即可。
          #
          # 【必须跳过符号链接】该包含 3 个 symlink，且全在 test/ 目录里
          # （libxml2/test/relaxng/*.rng、HighFive/tests/test_project/*.cpp），
          # 与 IQmol 构建无关。但 Windows 创建 symlink 需管理员权限或开发者模式，
          # GitHub runner 默认两者都没有，tar 会报
          #   "Cannot create symlink to ...: No such file or directory"
          # 并以非零退出——即使 99.99% 的文件都已正确解出。
          # 7z 也不可靠：7-Zip 26 的 "Dangerous link path was ignored"
          # 同样是 exit 2。
          #
          # 注意：必须逐个精确排除，不能用 --exclude='*/test/*'。
          # 包内有 17 个 test/CMakeLists.txt 是构建必需的
          # （hdf5 10 个、libarchive 5 个、openbabel / libssh2 / yaml-cpp 各 1 个），
          # 粗放排除会导致 configure 报
          #   "modules/libarchive/*/test does not contain a CMakeLists.txt file"
          # 而直接失败（run 37103996117 实测）。
          tar -xzf submodules-package/IQmol-submodules.tar.gz \
            --exclude='modules/libxml2/test/relaxng/ambig_name-class.rng' \
            --exclude='modules/libxml2/test/relaxng/ambig_name-class2.rng' \
            --exclude='modules/HighFive/tests/test_project/read_write_vector_dataset.cpp' \
            || {
              echo "::warning::排除 symlink 后仍失败，改为全量解包并容忍 symlink 错误"
              tar -xzf submodules-package/IQmol-submodules.tar.gz || true
            }
          echo "== 校验关键 test/CMakeLists.txt 未被误删 =="
          MISSING_TEST=0
          for f in modules/libarchive/tar/test/CMakeLists.txt \
                   modules/libarchive/libarchive/test/CMakeLists.txt \
                   modules/libarchive/cat/test/CMakeLists.txt \
                   modules/libarchive/cpio/test/CMakeLists.txt \
                   modules/libarchive/unzip/test/CMakeLists.txt \
                   modules/libssh2/tests/CMakeLists.txt \
                   modules/yaml-cpp/test/CMakeLists.txt; do
            [ -f "$f" ] || { echo "::error::缺失 $f"; MISSING_TEST=1; }
          done
          [ "$MISSING_TEST" = "0" ] || exit 1
          echo "  全部就位"
          echo "== 解包结果 =="
          ls -d modules/*/ 2>/dev/null || { echo "::error::modules/ 为空"; exit 1; }
          echo "== 各子模块文件数 =="
          for d in modules/*/; do
            printf "  %-28s %s\n" "$d" "$(find "$d" -type f 2>/dev/null | wc -l)"
          done

      # 关键：必须走 scripts/build_windows.sh，不能直接 cmake。
      # 该脚本承载了 Windows 专属的全部修复，直接 cmake 会绕过它们导致必崩：
      #   1) 解压并应用 4 个 OpenBabel 补丁包（deps / fix / formats-fix /
      #      data-headers）—— 尤其 data-headers：MinGW 无法执行 bin2hex.pl，
      #      没有预生成头会报 "'BondTypeData' was not declared"
      #   2) 修 openbabel/data/CMakeLists.txt 为预生成头方案
      #   3) 修 openbabel/src/CMakeLists.txt 静态分支漏加
      #      ${format}_additional_sources 的问题
      #   4) 拦截 OpenBabel external 三件套缺失（缺了 configure 必 FATAL_ERROR）
      #   5) 兜底补全 modules/CMakeLists.txt（libQGLViewer 聚合脚本，缺则必崩）
      #   6) 用 -G "MinGW Makefiles" + CMAKE_PREFIX_PATH=/mingw64，
      #      缺了 CMake 找不到 Qt/Boost，Generate 阶段就失败
      # 另外生成器必须是 MinGW Makefiles（配 mingw32-make），
      # 不能用 Ninja——OpenBabel 的 MinGW 链接在 Ninja 下已知出问题。
      - name: 配置 + 编译（scripts/build_windows.sh，含全部 Windows 专属修复）
        run: |
          export PATH="/mingw64/bin:$PATH"
          bash scripts/build_windows.sh --clean
        env:
          # CI 上仅做编译验证 + 出包；严格 l10n 由 i18n-tqa.yml 单独把关
          IQMOL_STRICT_L10N: "OFF"

      - name: 校验产物
        run: |
          set -e
          test -f build/bin/IQmol.exe || { echo "::error::未生成 build/bin/IQmol.exe"; exit 1; }
          ls -la build/bin/IQmol.exe
          if [ -f build/bin/translations/zh_CN.qm ]; then
            echo "zh_CN.qm 已生成"
          else
            echo "::error::zh_CN.qm 未生成，界面将回退英文"
            exit 1
          fi

      - name: 打包（scripts/package_windows.sh，含自包含性自检）
        run: |
          bash scripts/package_windows.sh --out dist --zip

      - name: 列出打包产物
        run: ls -la dist/

      - name: 生成校验和
        run: |
          cd dist
          for f in *.7z *.zip; do
            [ -f "$f" ] && sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt || true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: IQmol-windows-x64-zh_CN
          path: |
            dist/*.7z
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: 附加到 Release（仅在推送 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.7z
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: false
          draft: false
        # 包已经产出并上传 artifact 了，挂 Release 只是"顺手多一个下载入口"。
        # 实测（v3.2.4-zh_CN）：权限不足时这步 403，却把整个 job 判为 failed，
        # 让人误以为构建失败。改成不阻塞——真正的失败在上面 11 步。
        continue-on-error: true

      - name: 冒烟测试（验证 exe 可启动）
        run: |
          cd build
          # GUI 程序无控制台输出；能跑过 3 秒不崩溃、且写出日志即视为启动成功
          timeout 20 ./bin/IQmol.exe --version || true
          echo "--- 冒烟测试完成 ---"
        continue-on-error: true
