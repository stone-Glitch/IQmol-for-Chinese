# dependencies.lock — IQmol-for-Chinese 第三方依赖锁定清单
#
# 用途（应对审计报告 §5.1/§5.3/§16.3）：把 9 个 git submodule 的精确 commit、
#       来源 URL 与许可证集中登记，供供应链审计复核。
#
# 说明：
#   · 本仓已通过 git 对象级（gitlink，模式 160000）将每个子模块锁定到下方 commit，
#     即「已锁定到精确 commit」在技术层面成立；本文件是其人类可读清单。
#   · `expected_sha256` 列为上游归档/ vendored tarball 的预期哈希，需在引入时补齐
#     （当前多为 待填，待随包 SHA256SUMS.txt 或上游归档核对后填入）。
#   · 许可证以各上游仓库 LICENSE 为准，此处为常见 SPDX 提示，标记「需复核」。
#   · 生成方式：`git ls-files -s modules/` 取 commit；`.gitmodules` 取 URL。

submodules:
  - name: libssh2
    url: https://github.com/libssh2/libssh2.git
    commit: 88a960a86b9ffbabd17a4bbcf767e26514c4678e
    license: BSD-3-Clause        # 需复核
    expected_sha256: 待填
